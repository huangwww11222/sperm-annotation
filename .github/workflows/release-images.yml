name: Publish versioned images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            suffix: '-cpu'
            index: https://download.pytorch.org/whl/cpu
          - component: backend
            suffix: '-gpu'
            index: https://download.pytorch.org/whl/cu132
          - component: frontend
            suffix: ''
            index: ''
    steps:
      - uses: actions/checkout@v6
      - name: Version and image identity
        id: image
        env:
          VERSION: ${{ github.ref_name }}
          COMPONENT: ${{ matrix.component }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: PYTORCH_INDEX_URL=${{ matrix.index }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
