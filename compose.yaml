name: rare-sperm-annotation

services:
  backend:
    image: ${BACKEND_IMAGE:-rare-sperm-annotation-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu132}
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      APP_STORAGE_DIR: /data/storage
      APP_DB_FILE: /data/database/app.db
      SAM3_MODEL_ID: /models/sam3
      SAM3_DEVICE: ${SAM3_DEVICE:-cuda}
      SAM3_DTYPE: ${SAM3_DTYPE:-bfloat16}
      SAM3_TRACK_FRAMES: ${SAM3_TRACK_FRAMES:-120}
      ANOMALY_REVIEW_LOOKBACK_FRAMES: ${ANOMALY_REVIEW_LOOKBACK_FRAMES:-5}
      ANOMALY_SIDE_EXIT_MARGIN_PX: ${ANOMALY_SIDE_EXIT_MARGIN_PX:-10}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-./runtime}/storage
        target: /data/storage
      - type: bind
        source: ${APP_DATA_ROOT:-./runtime}/database
        target: /data/database
      - type: bind
        source: ${SAM3_MODEL_HOST_PATH:-./backend/track_modul/facebook--sam3/snapshots/master}
        target: /models/sam3
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-rare-sperm-annotation-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
